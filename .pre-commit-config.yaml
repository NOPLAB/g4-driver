# Pre-commit hooks configuration for g4-driver project
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Rust formatting, linting and testing at workspace level
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with cargo clippy
        entry: cargo clippy --workspace --exclude g4-driver-firmware --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: Run Rust tests with cargo test
        entry: cargo test
        language: system
        files: \.rs$
        pass_filenames: false

  # Firmware (separate target, requires individual handling)
  - repo: local
    hooks:
      - id: cargo-clippy-firmware
        name: cargo clippy (firmware)
        description: Lint firmware Rust code with cargo clippy
        entry: bash -c 'cd firmware && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: ^firmware/.*\.rs$
        pass_filenames: false
      - id: cargo-build-firmware
        name: cargo build (firmware)
        description: Build firmware to catch compilation errors
        entry: bash -c 'cd firmware && cargo build'
        language: system
        files: ^firmware/.*\.rs$
        pass_filenames: false

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
